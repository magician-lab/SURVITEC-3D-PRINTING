<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | SURVITEC 3D</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);overflow:hidden}
body::before,body::after{content:"";position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(100px);z-index:0}
body::before{background:#60a5fa;top:-100px;left:-100px}
body::after{background:#a78bfa;bottom:-100px;right:-100px}
.container{width:420px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);padding:35px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,0.3);z-index:1;color:white}
.header{text-align:center;margin-bottom:25px}
.header i{font-size:50px;margin-bottom:10px;color:#fff}
.header h2{font-size:24px;margin-bottom:5px}
.header p{font-size:13px;opacity:0.8}
.input-group{position:relative;margin-bottom:18px}
.input-group input{width:100%;padding:14px 45px 14px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:white;outline:none;transition:0.3s;font-size:15px}
.input-group input::placeholder{color:rgba(255,255,255,0.6)}
.input-group input:focus{border-color:#60a5fa;box-shadow:0 0 10px rgba(96,165,250,0.5)}
.input-group i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.7);cursor:pointer}
button{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:white;font-size:15px;cursor:pointer;transition:0.3s;font-weight:bold}
button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,0.3)}
.flash{padding:10px;margin-bottom:12px;border-radius:8px;font-size:13px}
.flash.success{background:rgba(34,197,94,0.2)}
.flash.error{background:rgba(239,68,68,0.2)}
.footer{text-align:center;margin-top:15px;font-size:12px;opacity:0.7}
.footer a{color:#60a5fa;text-decoration:none}
@media(max-width:500px){.container{width:90%}}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <i class="fas fa-key"></i>
        <h2>Reset Password</h2>
        <p>Enter your new password below</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="input-group">
            <input type="password" id="password" name="password" placeholder="New Password" required minlength="6">
            <i class="fas fa-eye" onclick="togglePassword()"></i>
        </div>
        <button type="submit"><i class="fas fa-check-circle"></i> Reset Password</button>
    </form>

    <div class="footer">
        <a href="/system/login"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
</div>

<script>
function togglePassword(){
    let p=document.getElementById("password");
    let icon=p.nextElementSibling;
    if(p.type==="password"){p.type="text";icon.classList.remove("fa-eye");icon.classList.add("fa-eye-slash")}
    else{p.type="password";icon.classList.remove("fa-eye-slash");icon.classList.add("fa-eye")}
}
</script>
</body>
</html>
