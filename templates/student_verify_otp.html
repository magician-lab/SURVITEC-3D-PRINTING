<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP - Student</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    overflow: hidden;
}

body::before,
body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
}

body::before {
    background: #60a5fa;
    top: -100px;
    left: -100px;
}

body::after {
    background: #a78bfa;
    bottom: -100px;
    right: -100px;
}

.container {
    width: 420px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    z-index: 1;
    color: white;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header i {
    font-size: 50px;
    margin-bottom: 10px;
    color: #fff;
}

.header h2 {
    font-size: 24px;
    margin-bottom: 5px;
}

.header p {
    font-size: 13px;
    opacity: 0.8;
}

.flash {
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    font-size: 13px;
}

.flash.success { background: rgba(34,197,94,0.2); }
.flash.error { background: rgba(239,68,68,0.2); }
.flash.warning { background: rgba(245,158,11,0.2); }

.input-group {
    position: relative;
    margin-bottom: 18px;
}

.input-group input {
    width: 100%;
    padding: 14px 45px 14px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
    transition: 0.3s;
    text-align: center;
    font-size: 1.3em;
    letter-spacing: 8px;
}

.input-group input::placeholder {
    color: rgba(255,255,255,0.6);
    letter-spacing: 2px;
    font-size: 0.7em;
}

.input-group input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 10px rgba(96,165,250,0.5);
}

.input-group i {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.7);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.note {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
    margin-top: 10px;
}

.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.7;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    transition: 0.3s;
}

.back-link:hover {
    color: white;
}

@media(max-width:500px){
    .container{
        width: 90%;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <i class="fas fa-shield-halved"></i>
        <h2>Verify OTP</h2>
        <p>Student - Enter the 6-digit code sent to your email</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/student/verify_otp">

        <div class="input-group">
            <input type="text" name="otp" maxlength="6" placeholder="Enter 6-digit OTP" required>
            <i class="fas fa-lock"></i>
        </div>

        <button type="submit">
            <i class="fas fa-check-circle"></i> Verify OTP
        </button>

    </form>

    <p class="note">OTP expires in 10 minutes</p>

    <a href="/student/forgot" class="back-link"><i class="fas fa-arrow-left"></i> Resend OTP</a>

    <div class="footer">
        SURVITEC 3D SYSTEM &bull; Student Portal
    </div>

</div>

</body>
</html>
