<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Consent Declined</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{

background:#fff5f5;

font-family:Segoe UI;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

width:90%;

max-width:650px;

background:white;

padding:50px;

text-align:center;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.icon{

font-size:90px;

color:#dc2626;

margin-bottom:25px;

}

h2{

color:#dc2626;

margin-bottom:20px;

}

.message{

line-height:1.8;

margin-bottom:30px;

}

.close{

display:inline-block;

padding:14px 30px;

background:#dc2626;

color:white;

text-decoration:none;

border-radius:8px;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">

<i class="fas fa-times-circle"></i>

</div>

<h2>

Consent Declined

</h2>

<div class="message">

You declined this consent.

System access will remain unavailable until a valid consent has been accepted.

</div>

<a

href="/"

class="close">

Close

</a>

</div>

</body>

</html>
