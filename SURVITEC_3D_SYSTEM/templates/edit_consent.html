<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Consent</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f7fb;
}

.container{
width:95%;
max-width:900px;
margin:40px auto;
}

.card{

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

h2{

color:#2563eb;

margin-bottom:25px;

}

.form-group{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#444;

}

input,
select,
textarea{

width:100%;

padding:12px;

border:1px solid #d1d5db;

border-radius:8px;

font-size:15px;

}

textarea{

height:280px;

resize:vertical;

}

.buttons{

margin-top:30px;

display:flex;

gap:15px;

flex-wrap:wrap;

}

.btn{

padding:12px 22px;

border:none;

border-radius:8px;

cursor:pointer;

text-decoration:none;

font-weight:bold;

}

.save{

background:#2563eb;

color:white;

}

.save:hover{

background:#1d4ed8;

}

.cancel{

background:#6b7280;

color:white;

}

.cancel:hover{

background:#4b5563;

}

.info{

background:#eff6ff;

padding:15px;

border-left:5px solid #2563eb;

margin-bottom:25px;

border-radius:6px;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>

<i class="fas fa-file-signature"></i>

Edit Consent

</h2>

<div class="info">

Editing Consent ID:
<strong>{{ consent.id }}</strong>

</div>

<form method="POST">

<div class="form-group">

<label>

Consent Title

</label>

<input

type="text"

name="title"

required

value="{{ consent.title }}">

</div>

<div class="form-group">

<label>

Target User

</label>

<select

name="target"

required>

<option value="Student"
{% if consent.target=="Student" %}selected{% endif %}>
Student
</option>

<option value="Parent"
{% if consent.target=="Parent" %}selected{% endif %}>
Parent
</option>

<option value="SchoolAdmin"
{% if consent.target=="SchoolAdmin" %}selected{% endif %}>
School Administrator
</option>

</select>

</div>

<div class="form-group">

<label>

Version

</label>

<input

type="text"

name="version"

required

value="{{ consent.version }}">

</div>

<div class="form-group">

<label>

Effective From

</label>

<input

type="date"

name="effective_date"

value="{% if consent.effective_from %}{{ consent.effective_from.strftime('%Y-%m-%d') }}{% endif %}">

</div>

<div class="form-group">

<label>

Consent Content

</label>

<textarea

name="content"

required>{{ consent.content }}</textarea>

</div>

<div class="buttons">

<button

type="submit"

class="btn save">

<i class="fas fa-save"></i>

Update Consent

</button>

<a

href="{{ url_for('manage_consents') }}"

class="btn cancel">

<i class="fas fa-times"></i>

Cancel

</a>

</div>

</form>

</div>

</div>

</body>

</html>
