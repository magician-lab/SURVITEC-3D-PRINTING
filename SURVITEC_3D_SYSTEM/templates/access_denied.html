```html
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Consent Required</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{
background:#eef4ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:700px;
background:white;
padding:45px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.icon{
font-size:90px;
color:#f59e0b;
margin-bottom:20px;
}

h2{
margin-bottom:15px;
color:#1e3a8a;
}

p{
line-height:1.8;
margin-bottom:30px;
}

.btn{

display:inline-block;

padding:15px 35px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:8px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">

<i class="fas fa-lock"></i>

</div>

<h2>

Consent Required

</h2>

<p>

Your login credentials were verified successfully.

However,

you cannot access the system until the required consent has been completed.

</p>

<a

href="{{ action_url }}"

class="btn">

Complete Consent

</a>

</div>

</body>

</html>
