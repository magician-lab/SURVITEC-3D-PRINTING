<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Expired Link</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{

background:#fffaf0;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:Segoe UI;

}

.card{

background:white;

padding:50px;

border-radius:15px;

width:90%;

max-width:700px;

text-align:center;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.icon{

font-size:90px;

color:#f59e0b;

margin-bottom:25px;

}

.btn{

display:inline-block;

margin-top:25px;

padding:14px 30px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:8px;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">

<i class="fas fa-clock"></i>

</div>

<h2>

Consent Link Expired

</h2>

<p>

This secure consent link has expired.

Please request another consent email.

</p>

<a

href="{{ url_for('request_new_consent', user_type=token.user_type, user_id=token.user_id) }}"

class="btn">

Request New Link

</a>

</div>

</body>

</html>
